services:
  # PostgreSQL 数据库
  postgres:
    image: postgres:16
    container_name: nav-deployer-postgres
    environment:
      POSTGRES_DB: nav_deployer
      POSTGRES_USER: appuser
      POSTGRES_PASSWORD: app123456
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U appuser -d nav_deployer"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # Redis 缓存
  redis:
    image: redis:7
    container_name: nav-deployer-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # MinIO 对象存储（9000 API，9001 Web 控制台）
  minio:
    image: minio/minio:RELEASE.2025-07-23T15-54-02Z
    container_name: nav-deployer-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # Spring Boot 应用（镜像内已包含前端构建产物，8083 直接访问完整 UI）
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: ${APP_IMAGE:-nav-deployer:v0.2.0}
    container_name: nav-deployer-app
    ports:
      - "8083:8083"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/nav_deployer
      SPRING_DATASOURCE_USERNAME: appuser
      SPRING_DATASOURCE_PASSWORD: app123456
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: "6379"
      MINIO_ENDPOINT: http://minio:9000
      # 预签名 URL 的 MinIO 对外端口（host 按浏览器访问地址自动推导）
      MINIO_EXTERNAL_PORT: "9000"
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin123
      MINIO_BUCKET: user-avatars
      MINIO_MAPS_BUCKET: nav-maps
      # 与仿真机器人共享网络，直接使用桥接服务的 Docker DNS 名称。
      SIM_AGV_ENABLED: ${SIM_AGV_ENABLED:-true}
      SIM_AGV_WS_URL: ${SIM_AGV_WS_URL:-ws://agv-bridge:9090}
      SIM_AGV_TF_CHILD_FRAME: ${SIM_AGV_TF_CHILD_FRAME:-AGV002/base_link}
      # 留空时从 rosbridge 主机名推导 HTTP 8089。
      MAP3D_BASE_URL: ${MAP3D_BASE_URL:-}
      # ---- RMS 对接（zenoh）----
      # 未显式关闭时容器会连接打包内置的 zenoh 路由（config-json5.json）并自动注册
      RMS_ENABLED: ${RMS_ENABLED:-true}
      # 多实例/与本机开发同时运行时必须指定不同 SN（默认从固定种子生成，重复会互相顶号）
      RMS_ROBOT_SN: ${RMS_ROBOT_SN:-}
      # 切换 zenoh 环境时挂载外部配置并设置此路径（bj/cc/sz 变体见 src/main/resources）
      RMS_ZENOH_CONFIG_FILE: ${RMS_ZENOH_CONFIG_FILE:-}
      # ---- RMS 日志收集/质检图片/teach 采集样例目录（Linux 容器需挂载真实路径，Windows 默认值无效）----
      RMS_INSPECTION_IMAGE_DIR: ${RMS_INSPECTION_IMAGE_DIR:-}
      RMS_TEACH_SAMPLE_DIR: ${RMS_TEACH_SAMPLE_DIR:-}
    networks:
      - default
      - robot
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      # 日志持久化（RMS log/collect 打包的就是这里的文件）
      - app_logs:/app/logs
      # 切换 zenoh 环境时挂载外部配置：
      - ./modules/app/src/main/resources/config-json5.json:/app/config/zenoh.json5:ro
      # teach 采集 / 质检图片样例目录挂载示例：
      # - ./docker/samples:/app/samples:ro     # 配合 RMS_TEACH_SAMPLE_DIR=/app/samples
      # Windows 原生终端使用 C:/...；WSL 内的 Compose 使用 /mnt/c/...。
      - type: bind
        source: ${INSPECTION_IMAGE_HOST_DIR:-C:/Users/think/Pictures}
        target: /app/inspection-images
        read_only: true
        bind:
          create_host_path: false
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    restart: unless-stopped

networks:
  robot:
    external: true
    name: ${ROBOT_DOCKER_NETWORK:-simulated_chassis_agv_network}

volumes:
  postgres_data:
  redis_data:
  minio_data:
  app_logs:
