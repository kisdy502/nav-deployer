# 槽位 D 上位机实例（每台机器的第 4 台车，前端 5176 / 后端 8185）：
#   启动：docker compose --env-file docker/multi-robot/machines/<机号>.env -f docker-compose.slot-d.yml -p nav-deployer up -d
#   首次部署：docker/multi-robot/deploy-slot.ps1 -Slot D -Machine <机号>
# 槽位隔离三要素（同机多槽、跨机同配置）：
#   - 独立数据库 nav_deployer_d（本机 robot-postgres 内多库，flyway 自动建表）
#   - 独立 docker 网络 chassis-slot-d_agv_network（ws://agv-bridge:9090 解析到本槽仿真桥）
#   - RMS 身份从 machines/<机号>.env 注入（RMS_SN_D/RMS_NAME_D，全局唯一，缺失即报错）
# 端口表与机器布局见 docker/multi-robot/README.md
services:
  app-slot-d:
    image: ${APP_IMAGE:-nav-deployer:v0.0.7}
    container_name: nav-deployer-d
    ports:
      - "5176:8083"
      - "8185:8083"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://robot-postgres:5432/nav_deployer_d
      SPRING_DATASOURCE_USERNAME: robot_user
      SPRING_DATASOURCE_PASSWORD: robot_password
      SPRING_DATA_REDIS_HOST: robot-redis
      SPRING_DATA_REDIS_PORT: "6379"
      MINIO_ENDPOINT: http://robot-ceph-rgw:7480
      MINIO_EXTERNAL_PORT: "7480"
      MINIO_ACCESS_KEY: cephadmin
      MINIO_SECRET_KEY: cephpassword
      MINIO_BUCKET: user-avatars
      MINIO_MAPS_BUCKET: nav-maps
      SIM_AGV_ENABLED: "true"
      SIM_AGV_WS_URL: ws://agv-bridge:9090
      SIM_AGV_HTTP_PORT: "8080"
      SIM_AGV_TF_CHILD_FRAME: ${AGV_ID_D:-AGV005}/base_link
      NATIVE_MAP_TOKEN: zioneer.com
      NATIVE_MAP_BASE_URL: http://agv-bridge:8091
      RMS_ENABLED: "true"
      RMS_ROBOT_SN: ${RMS_SN_D:?RMS_SN_D missing -- pass --env-file docker/multi-robot/machines/<id>.env}
      RMS_ROBOT_NAME: ${RMS_NAME_D:?RMS_NAME_D missing -- pass --env-file docker/multi-robot/machines/<id>.env}
      RMS_ZENOH_CONFIG_FILE: /app/config/zenoh.json5
      RMS_INSPECTION_IMAGE_DIR: /app/inspection-images
    networks:
      - default
      - robot-slot-d
      - platform
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - app_logs_d:/app/logs
      - rms_templates_d:/app/data/rms-templates
      - ./modules/app/src/main/resources/config-json5-think.json:/app/config/zenoh.json5:ro
      - type: bind
        source: ${INSPECTION_IMAGE_HOST_DIR:-./docker/inspection-images}
        target: /app/inspection-images
        read_only: true
        bind:
          create_host_path: false
    restart: unless-stopped

networks:
  robot-slot-d:
    external: true
    name: chassis-slot-d_agv_network
  platform:
    external: true
    name: robot-platform-network

volumes:
  app_logs_d:
  rms_templates_d:
