server:
  port: 8083
  tomcat:
    accesslog:
      enabled: true
      directory: /tmp

spring:
  application:
    name: nav-deployer
  # @Scheduled 默认单线程：SSE 推流(100ms)/扫描(250ms)/模式任务轮询(500ms)/对账(5s) 串行会互相拖慢，扩池隔离
  task:
    scheduling:
      pool:
        size: 4
  # IDEA 控制台 ANSI 探测常失败导致日志全白，强制开启彩色输出（logback %clr 与消息内嵌色码都依赖它）
  output:
    ansi:
      enabled: always
  datasource:
    # 本地开发用默认值（platform 共享库 robot-postgres :55432），Docker 部署时由环境变量覆盖
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:55432/nav_deployer}
    username: ${SPRING_DATASOURCE_USERNAME:robot_user}
    password: ${SPRING_DATASOURCE_PASSWORD:robot_password}
    driver-class-name: org.postgresql.Driver
  sql:
    init:
      # 表结构升级全部交给 Flyway（classpath:db/migration），不再执行 schema.sql
      mode: never
  flyway:
    enabled: true
    locations: classpath:db/migration
    # 已有库（schema.sql 时代建过表）自动基线化为 V1，只执行 V2 及之后的脚本；新库从 V1 全量执行
    baseline-on-migrate: true
    baseline-version: 1
  web:
    resources:
      cache:
        cachecontrol:
          # 页面禁止启发式缓存，避免改版后浏览器仍用旧 JS 调旧接口
          no-cache: true
  jackson:
    # 接口契约统一 snake_case（created_at / avatar_key / expire_in_seconds）
    property-naming-strategy: SNAKE_CASE
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
  servlet:
    multipart:
      # V2 整机地图包含栅格、业务元数据和 Lightning 点云。
      max-file-size: 160MB
      max-request-size: 161MB

mybatis-plus:
  global-config:
    banner: false
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl

minio:
  # 应用数据操作用的地址（platform 共享 ceph-rgw :7480；Docker 内为 http://host.docker.internal:7480）
  endpoint: ${MINIO_ENDPOINT:http://localhost:7480}
  # 预签名 URL 的 MinIO 外部端口，host 部分按浏览器请求的 Host 动态推导
  external-port: ${MINIO_EXTERNAL_PORT:7480}
  # 可选：MinIO 独立域名（如 https://minio.example.com）。配置后固定用它签名；留空则动态推导
  external-endpoint: ${MINIO_EXTERNAL_ENDPOINT:}
  access-key: ${MINIO_ACCESS_KEY:cephadmin}
  secret-key: ${MINIO_SECRET_KEY:cephpassword}
  bucket: ${MINIO_BUCKET:user-avatars}
  region: ${MINIO_REGION:us-east-1}
  # 部署程序：建图快照（gzip OccupancyGrid）存储桶
  maps-bucket: ${MINIO_MAPS_BUCKET:nav-maps}

logging:
  file:
    name: ${LOG_FILE:logs/nav-deployer.log}
  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 7
      total-size-cap: 50MB
  level:
    com.agv.navdeployer: ${LOG_LEVEL:info}



# ============================================================
# RMS (robot-management-service) 对接：默认关闭。
# 启用后上位机以机器人身份经 zenoh 上报状态、接收 RMS 任务指令；
# 移动类任务真实执行（委托 MoveTaskService -> follow_edge）。
# ============================================================
rms:
  enabled: ${RMS_ENABLED:true}
  zenoh:
    # 连接配置走 zenoh 标准做法：classpath 的 config-json5.json（endpoints/scouting/namespace/TLS）
    # 部署换端点不重打包时，用 config_file 指外部文件：
    config_file: ${RMS_ZENOH_CONFIG_FILE:}
    query_timeout_ms: 5000
    continue_without_register: false
    # register_key 留空用默认；robot_key_prefix 是 legacy 心跳/状态的 key 前缀
    # RMS 侧订阅的是 robot-management/robots/{code}/status/report（RobotZenohConstant）
    robot_key_prefix: ${RMS_ROBOT_KEY_PREFIX:robot-management/robots}
  robot:
    # robot_code 留空 = RMS 注册时自动分配（推荐，与真机行为一致）
    robot_code: ${RMS_ROBOT_CODE:}
    # robot_sn 是 RMS 去重键（跨重启不变→更新而非新建）。非空即强制生效，两种改法随时可换：
    #   1) 环境变量：RMS_ROBOT_SN=dev-think-01（CI / 容器部署）
    #   2) 直接写值：robot_sn: dev-think-01（本机联调；多机联调时各自写不同值）
    # 留空 = 固定种子生成的默认 SN（所有实例相同 → 会共用同一台 RMS 机器人，启动时有 WARN 提示）
    robot_sn: ${RMS_ROBOT_SN:jy-devlopment-202610270955-lifeiyu}
    robot_name: ${RMS_ROBOT_NAME:JY历飞雨}
    robot_type: ${RMS_ROBOT_TYPE:qc-robot}
    # 注册信息展示（RMS 机器人详情页）：型号 / 固件版本 / API 版本 / 厂商
    model: ${RMS_ROBOT_MODEL:SIM-3W-2D}
    hardware_version: ${RMS_ROBOT_HARDWARE_VERSION:sim-v2}
    firmware_version: ${RMS_ROBOT_FIRMWARE_VERSION:nav-deployer-1.0.0}
    # api_version（RMS 页面「API 版本」）复用 protocol_version 值
    protocol_version: ${RMS_ROBOT_PROTOCOL_VERSION:v1}
    # ip 留空 = 自动取本机 IP
    ip: ${RMS_ROBOT_IP:}
    manufacturer: ${RMS_ROBOT_MANUFACTURER:Zioneer}
  report:
    heartbeat_interval_ms: 5000
    status_interval_ms: 5000
    publish_legacy_status: true
    publish_body_status: true
    # 排查开关：逐条打印心跳/状态上报（排查云端机器人掉线时临时打开）
    verbose_log: ${RMS_VERBOSE_LOG:false}
    # 周期类消息（RMS 轮询查询 status/pose/task_status 等、心跳/状态上报汇总）的
    # 日志节流间隔：同一 key 每间隔最多 1 条 INFO（建议 10000~30000ms）。
    # 一次性指令（task/add、mapping/change、agv/relocate…）不受此限，始终全量打印请求+回包。
    periodic_log_interval_ms: ${RMS_PERIODIC_LOG_INTERVAL_MS:30000}
    # 周期上报「结果无变化」时的保底间隔（心跳/状态上报成功且内容同上次时降频到该间隔，
    # 不再每 30s 重复同样内容；失败 WARN 与一次性指令不受影响）
    unchanged_log_interval_ms: ${RMS_UNCHANGED_LOG_INTERVAL_MS:60000}
  behavior:
    # 仿真质检：任务正常完成时 action_status=3，业务质检结果独立为 OK / NG
    inspection_duration_ms: 8000
    # 机械臂阶段到位等待的墙钟总时长下限（arm_move 时长是仿真时间；宿主机过载 RTF<1 时需放大，默认容 RTF=0.1）
    arm_phase_wall_clock_timeout_ms: ${RMS_ARM_PHASE_TIMEOUT_MS:60000}
    inspection_result: OK
    # 行为树 action 占位执行时长（fetch_cable 等无专用执行器的模板，协议不携带 destination）
    action_duration_ms: 3000
    # 仿真质检图片目录（含子目录）：打 zip 时随机取 2~3 张真实图片；为空或无图时回退占位图
    inspection_image_dir: ${RMS_INSPECTION_IMAGE_DIR:C:/Users/think/Pictures}
    # teach 2D/3D 采集样例目录（含子目录）：teach/capture 打 zip 时取前几个文件；为空回退 application.yaml+runtime 信息
    teach_sample_dir: ${RMS_TEACH_SAMPLE_DIR:}
    # 任务模板存储目录（真机机制：模板由上层经 task_template/add 下发并落盘存档，
    # 任务引用未下发的模板时按真机口径拒绝「类型 x 的任务模板 x 不存在」）。
    # 相对路径基于工作目录，机器人侧自行约定；充电任务凭任务携带的
    # parameters.destination 自主导航到充电桩，无需本机配置充电点。
    template_dir: ${RMS_TEMPLATE_DIR:data/rms-templates}
    # home_pose:   { x: 0.0, y: 0.0, yaw: 0.0 }
    compatible_chargers: []

# ============================================================
# Simulated AGV (rosbridge) telemetry source.
# Live data comes from the simulated_chassis stack (Gazebo + Nav2 + Cartographer)
# through agv_bridge_v2: /agv/status (1Hz), /tf (map->AGV001/base_link, 10Hz).
# Prerequisite: `docker compose --profile navigation up -d` on the sim host.
# ============================================================
sim_agv:
  enabled: ${SIM_AGV_ENABLED:true}
  ws_url: ${SIM_AGV_WS_URL:ws://localhost:9090}
  # 机器人侧 HTTP 统一入口（单进程按 URL 路由：/maps/*、/native/*、包资源），host 取 ws_url 的主机名
  robot_http_port: ${SIM_AGV_HTTP_PORT:8080}
  # Must match the bridge agv_id (child_frame_id = <agv_id>/base_link).
  tf_child_frame: ${SIM_AGV_TF_CHILD_FRAME:AGV001/base_link}
  tf_throttle_ms: 0
  # /odom（里程计位姿+速度）：odom_relay_node 转发，twist 驱动状态栏速度显示；
  # 位姿部分同时补充两段式插值环（odom→base_link 段），与 /tf 同源不冲突
  odom_enabled: ${SIM_AGV_ODOM_ENABLED:true}
  scan_throttle_ms: 200
  # rosbridge 收发消息日志（按消息价值分级）：
  # 指令类（call_service/service_response/action goal·result/重定位/切图）——每条必打、
  #   【全量内容】（上限 full_chars=64KB），可完整复制分析。
  # 业务状态话题（/agv/status、/agv/localization_operation）——内容变化（去 stamp、浮点取 2 位）
  #   → 每 topic_interval_ms 最多 1 条【全量】；未变化 → 每 unchanged_interval_ms 保底 1 条摘要。
  # 传感器流话题（雷达/agv/pose/tf/odom/joint_states/feedback/cmd_vel）——固定每
  #   sensor_interval_ms 一条摘要（默认 30s），无变化分析价值。
  ws_message_log_commands_enabled: ${SIM_AGV_WS_CMD_LOG:true}
  ws_message_log_enabled: ${SIM_AGV_WS_MSG_LOG:false}
  ws_message_log_full_chars: ${SIM_AGV_WS_FULL_LOG_CHARS:65536}
  ws_message_log_unchanged_interval_ms: ${SIM_AGV_WS_UNCHANGED_LOG_MS:60000}
  ws_message_log_sensor_interval_ms: ${SIM_AGV_WS_SENSOR_LOG_MS:60000}
  goal_timeout_s: 600
  # 机械臂归位联锁（真机安全语义：臂未归位时移动作业可能撞击人员/设施）。
  # HOME=各侧臂关节角与归位姿态差 < arm_home_tolerance_rad；UNKNOWN（无关节数据）时
  # arm_strict_unknown=true 拒绝 / false 放行（兼容不发布 /joint_states 的旧机器人栈）
  arm_gate_enabled: ${SIM_AGV_ARM_GATE_ENABLED:true}
  arm_strict_unknown: ${SIM_AGV_ARM_STRICT_UNKNOWN:false}
  # 模式任务（切图等）整体截止时间
  mode_task_timeout_ms: 90000

# 充电任务（前端「去充电」与 RMS charge/replace_battery 共用 ChargeService）。
# 机器人侧契约：/agv/set_charging（std_srvs/SetBool）data=true/false 开始/停止充电；
# 充电真值以 /agv/status 遥测（charging/charge_connected/battery_data_valid）为准，
# 任务完成标志 = 对接确认（遥测 charging=true），充到多少/何时断充由上层调度控制。
charge:
  service: /agv/set_charging
  service_timeout_ms: 5000
  # 目标电量（%）：仅记录展示（对接完成不再等电量；「充到 X% 作业」由调度自行跟踪）
  target_battery_pct: 100.0
  # set_charging 成功后等遥测确认 charging=true 的超时
  confirm_timeout_ms: 20000
  # 到桩后停稳等待：机器人侧拒绝运动中的充电请求（末端旋转/减速残余速度会触发拒绝），
  # 满足「最小等待 + /odom 速度近零」才调 set_charging；odom 不可用退化为纯延时；
  # 超过 max 上限强制尝试（odom 异常兜底）
  dock_settle_min_ms: 2000
  dock_settle_max_ms: 15000
  # 到桩校验半径（米）：开始充电前校验机器人与充电桩坐标的平面距离 ≤ 该值。
  # 路线导航终点是「离桩最近的 waypoint」（可能距桩数米），仿真机器人 set_charging 又不校验
  # 位置——超出半径先自动补一段精确接近段，补完仍超出则任务报错拒绝充电。
  # 救援充电（模拟充电器，无需在桩上）豁免。
  odom_quiet_linear_ms: 0.03
  odom_quiet_angular_rad: 0.05
  # 状态轮询周期
  poll_interval_ms: 1000
  # 充电全流程看门狗（导航+充电总时长上限）
  max_duration_ms: 14400000
