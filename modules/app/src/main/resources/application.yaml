server:
  port: 8083
  tomcat:
    accesslog:
      enabled: true
      directory: /tmp

spring:
  application:
    name: nav-deployer
  # IDEA 控制台 ANSI 探测常失败导致日志全白，强制开启彩色输出（logback %clr 与消息内嵌色码都依赖它）
  output:
    ansi:
      enabled: always
  datasource:
    # 本地开发用默认值，Docker 部署时由环境变量覆盖
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/nav_deployer}
    username: ${SPRING_DATASOURCE_USERNAME:appuser}
    password: ${SPRING_DATASOURCE_PASSWORD:app123456}
    driver-class-name: org.postgresql.Driver
  sql:
    init:
      # 每次启动执行 schema.sql（幂等建表），替代 JPA 的 ddl-auto
      mode: always
  web:
    resources:
      cache:
        cachecontrol:
          # 页面禁止启发式缓存，避免改版后浏览器仍用旧 JS 调旧接口
          no-cache: true
  jackson:
    # 接口契约统一 snake_case（created_at / avatar_key / expire_in_seconds）
    property-naming-strategy: SNAKE_CASE
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 10MB

mybatis-plus:
  global-config:
    banner: false
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl

minio:
  # 应用数据操作用的地址（Docker 内为 http://minio:9000）
  endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
  # 预签名 URL 的 MinIO 外部端口，host 部分按浏览器请求的 Host 动态推导
  external-port: ${MINIO_EXTERNAL_PORT:9000}
  # 可选：MinIO 独立域名（如 https://minio.example.com）。配置后固定用它签名；留空则动态推导
  external-endpoint: ${MINIO_EXTERNAL_ENDPOINT:}
  access-key: ${MINIO_ACCESS_KEY:minioadmin}
  secret-key: ${MINIO_SECRET_KEY:minioadmin123}
  bucket: ${MINIO_BUCKET:user-avatars}
  region: ${MINIO_REGION:us-east-1}
  # 部署程序：建图快照（gzip OccupancyGrid）存储桶
  maps-bucket: ${MINIO_MAPS_BUCKET:nav-maps}

logging:
  file:
    name: ${LOG_FILE:logs/nav-deployer.log}
  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 7
      total-size-cap: 50MB
  level:
    com.agv.navdeployer: ${LOG_LEVEL:info}



# ============================================================
# RMS (robot-management-service) 对接：默认关闭。
# 启用后上位机以机器人身份经 zenoh 上报状态、接收 RMS 任务指令；
# 移动类任务真实执行（委托 MoveTaskService -> follow_edge）。
# ============================================================
rms:
  enabled: ${RMS_ENABLED:true}
  zenoh:
    # 连接配置走 zenoh 标准做法：classpath 的 config-json5.json（endpoints/scouting/namespace/TLS）
    # 部署换端点不重打包时，用 config_file 指外部文件：
    # config_file: ${RMS_ZENOH_CONFIG_FILE:}
    query_timeout_ms: 5000
    continue_without_register: false
    # register_key 留空用默认；robot_key_prefix 是 legacy 心跳/状态的 key 前缀
    # RMS 侧订阅的是 robot-management/robots/{code}/status/report（RobotZenohConstant）
    robot_key_prefix: ${RMS_ROBOT_KEY_PREFIX:robot-management/robots}
  robot:
    # robot_code 留空 = RMS 注册时自动分配（推荐，与真机行为一致）
    robot_code: ${RMS_ROBOT_CODE:}
    # robot_sn 是 RMS 去重键（跨重启不变→更新而非新建），默认从固定种子生成 32 位 hex
    robot_sn: ${RMS_ROBOT_SN:}
    robot_name: ${RMS_ROBOT_NAME:仿真机器人}
    robot_type: ${RMS_ROBOT_TYPE:qc-robot}
    # 注册信息展示（RMS 机器人详情页）：型号 / 固件版本 / API 版本 / 厂商
    model: ${RMS_ROBOT_MODEL:SIM-3W-2D}
    hardware_version: ${RMS_ROBOT_HARDWARE_VERSION:sim-v2}
    firmware_version: ${RMS_ROBOT_FIRMWARE_VERSION:nav-deployer-1.0.0}
    # api_version（RMS 页面「API 版本」）复用 protocol_version 值
    protocol_version: ${RMS_ROBOT_PROTOCOL_VERSION:v1}
    # ip 留空 = 自动取本机 IP
    ip: ${RMS_ROBOT_IP:}
    manufacturer: ${RMS_ROBOT_MANUFACTURER:Zioneer}
  report:
    heartbeat_interval_ms: 5000
    status_interval_ms: 5000
    publish_legacy_status: true
    publish_body_status: true
    # 排查开关：逐条打印心跳/状态上报（排查云端机器人掉线时临时打开）
    verbose_log: ${RMS_VERBOSE_LOG:false}
  behavior:
    # 仿真质检：任务正常完成时 action_status=3，业务质检结果独立为 OK / NG
    inspection_duration_ms: 8000
    inspection_result: OK
    # 仿真质检图片目录（含子目录）：打 zip 时随机取 2~3 张真实图片；为空或无图时回退占位图
    inspection_image_dir: ${RMS_INSPECTION_IMAGE_DIR:C:/Users/think/Pictures}
    # teach 2D/3D 采集样例目录（含子目录）：teach/capture 打 zip 时取前几个文件；为空回退 application.yaml+runtime 信息
    teach_sample_dir: ${RMS_TEACH_SAMPLE_DIR:}
    # charge / return_home 目标坐标（未配置且 RMS 未带 destination 时任务失败）
    # charge_pose: { x: 0.0, y: 0.0, yaw: 0.0 }
    # home_pose:   { x: 0.0, y: 0.0, yaw: 0.0 }
    compatible_chargers: []

# ============================================================
# Simulated AGV (rosbridge) telemetry source.
# Live data comes from the simulated_chassis stack (Gazebo + Nav2 + Cartographer)
# through agv_bridge_v2: /agv/status (1Hz), /tf (map->AGV001/base_link, 10Hz).
# Prerequisite: `docker compose --profile navigation up -d` on the sim host.
# ============================================================
map3d:
  # 空值时从 sim_agv.ws_url 推导机器人主机，使用 HTTP 8089。
  base-url: ${MAP3D_BASE_URL:}

sim_agv:
  enabled: ${SIM_AGV_ENABLED:true}
  ws_url: ${SIM_AGV_WS_URL:ws://localhost:9090}
  status_topic: /agv/status
  tf_topic: /tf
  # 静态 TF：雷达安装关系（base_link → laser 的平移+旋转），点云安装变换优先来源；拿不到时回退 scan*_mount_yaw_deg
  tf_static_topic: /tf_static
  # Must match the bridge agv_id (child_frame_id = <agv_id>/base_link).
  tf_child_frame: AGV001/base_link
  tf_throttle_ms: 0
  odom_enabled: false
  odom_topic: /odom
  reconnect_delay_ms: 3000
  scan_enabled: true
  pose_topic: /agv/pose
  scan_throttle_ms: 200
  scan_topic_1: /scan_1
  scan_topic_2: /scan_2
  # 雷达安装朝向偏移（度）：雷达自身坐标系相对 base_link 的固定旋转角。
  # 双雷达对装（背靠背）时，反装的那个通常为 180。若画面上某雷达点云与实际障碍方向相反，调整此值（0/90/180/270）。
  # 雷达安装变换不在此配置：唯一来源是机器人自描述（/tf_static，URDF 发布）。
  # 缺失时后端打 ERROR 并丢弃该雷达点云，绝不用猜测值兼容。
  summary_interval_ms: 5000
  # 建图：/map 大消息订阅（分片重组在 RosbridgeClient 内完成）。
  # 按需订阅：仅 MAPPING 模式或 /live 被轮询时挂载（MapSubscriptionGuard），
  # 平时 rosbridge 上没有 /map 压力，遥控 /cmd_vel 不再被周期性挤慢。
  map_enabled: true
  map_topic: /map
  map_throttle_ms: 5000
  map_fragment_size: 500000
  # 下行通道：follow_edge action / set_control 服务 / 重定位
  follow_edge_action: /agv/follow_edge
  follow_edge_action_type: agv_bridge_v2_interfaces/action/FollowEdge
  set_control_service: /agv/set_control
  # 三舵轮全向底盘遥控：geometry_msgs/Twist，linear.x 前进、linear.y 左移、angular.z 左转
  cmd_vel_topic: /cmd_vel
  # rosbridge 收发消息高亮日志：指令类(goal/service/result)全量；
  # 话题数据按时间节流（同一话题每 topic_interval_ms 最多 1 条，/tf 实测 ~200Hz）；
  # 大报文(>10万字符)只打长度；间隔配 0 或负值 = 完全不打话题数据（只留指令日志）
  ws_message_log_enabled: ${SIM_AGV_WS_MSG_LOG:true}
  ws_message_log_max_chars: 300
  ws_message_log_topic_interval_ms: 10000
  service_timeout_ms: 5000
  goal_timeout_s: 600
  default_max_speed: 0.6
  default_step: 0.1
  # FOLLOW_PATH 起点纠偏：机器人距首段起点超过该距离（米）时，自动先插一段"驶向起点"
  follow_path_start_radius: 0.5
  # 机械臂归位联锁（真机安全语义：臂未归位时移动作业可能撞击人员/设施）。
  # HOME=各侧臂关节角与归位姿态差 < arm_home_tolerance_rad；UNKNOWN（无关节数据）时
  # arm_strict_unknown=true 拒绝 / false 放行（兼容不发布 /joint_states 的旧机器人栈）
  arm_gate_enabled: ${SIM_AGV_ARM_GATE_ENABLED:true}
  arm_strict_unknown: ${SIM_AGV_ARM_STRICT_UNKNOWN:false}
  arm_home_tolerance_rad: 0.1
  # 归位姿态（弧度）：按语义角色顺序 [pan, lift, elbow, wrist1, wrist2, wrist3]。
  # 机器人侧标定（关节名字母序 [elbow,lift,pan,wrist1..3] = [2.65,-2.6,0,-1.6208,-1.5708,0]）换算；
  # 运行期可被前端「设为归位位」覆盖
  arm_home_left:  [0, -2.6, 2.65, -1.62079632679, -1.57079632679, 0]
  arm_home_right: [0, -2.6, 2.65, -1.62079632679, -1.57079632679, 0]
  # 质检展开位姿（角色顺序）：质检任务三阶段序列（展臂→采集→收臂归位）的第一阶段目标
  arm_inspect_pose: [0.5, -1.2, 1.0, -0.5, 0, 0]
  # 地图管理服务（agv_bridge_v2 v0.3.0+；服务响应=已受理，完成看 mode 流转）
  list_maps_service: /agv/list_maps
  get_map_service: /agv/get_map
  load_map_service: /agv/load_map
  start_mapping_service: /agv/start_mapping
  save_map_service: /agv/save_map
  # 镜像状态新鲜度阈值：超过该时长未收到 /agv/status 视为 UNKNOWN，拒绝模式类操作。
  # 放宽到 15s：/agv/status(1Hz) 与 ~3MB 的 /map JSON 共用一条 rosbridge websocket，
  # 宿主机负载高时小消息会被挤过 5s；rosbridge 重连窗口同理。只拦"桥接真死"，放过抖动。
  status_fresh_ms: 15000
  # 模式任务（切图等）整体截止时间
  mode_task_timeout_ms: 90000
